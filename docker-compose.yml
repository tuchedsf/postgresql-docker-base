
services:
  postgres:
    image: postgres:18.6
    container_name: postgres-dev
    restart: unless-stopped

    env_file:
      - .env

    ports:
      # Acesso exclusivo pelo Mac e serviços locais
      - "127.0.0.1:5432:5432"

    volumes:
      # Persistência PostgreSQL 18+
      - postgres_data:/var/lib/postgresql

    networks:
      dev-db:
        aliases:
          - postgres-dev

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: postgres_dev_data

networks:
  dev-db:
    external: true
